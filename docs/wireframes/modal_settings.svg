<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" width="375" height="750" style="background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Phone Shell -->
  <rect x="5" y="5" width="365" height="740" rx="30" ry="30" fill="#ffffff" stroke="#1a202c" stroke-width="4"/>
  
  <!-- Status Bar -->
  <text x="30" y="32" font-size="12" font-weight="bold" fill="#1a202c">9:41</text>
  <text x="310" y="32" font-size="12" fill="#1a202c">📶 🔋</text>

  <!-- Navigation Header -->
  <rect x="7" y="45" width="361" height="45" fill="#2d3748"/>
  <text x="187.5" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">API 配額與 Token 設定</text>

  <!-- Dimmed Background Overlay -->
  <rect x="7" y="45" width="361" height="695" fill="#000000" opacity="0.4"/>

  <!-- Modal Container -->
  <g transform="translate(20, 110)">
    <rect x="0" y="0" width="335" height="520" rx="20" fill="#ffffff"/>
    
    <!-- Modal Title -->
    <text x="167.5" y="40" font-size="17" font-weight="bold" fill="#2d3748" text-anchor="middle">⚙️ API 配額模式設定</text>

    <!-- Mode 1: Public Shared Quota (Option Box) -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="305" height="85" rx="10" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1"/>
      <circle cx="20" cy="22" r="7" fill="#ffffff" stroke="#a0aec0" stroke-width="2"/>
      <text x="38" y="26" font-size="12" font-weight="bold" fill="#2d3748">模式 1：App 免費公用額度 (共享)</text>
      
      <text x="38" y="48" font-size="10.5" fill="#718096">• 今日美西重置剩餘：18 支刪除容量</text>
      <text x="38" y="66" font-size="10.5" fill="#718096">• 所有使用者共享 GCP 10,000 每日 Quota</text>
    </g>

    <!-- Mode 2: Personal BYOK (Selected Option Box) -->
    <g transform="translate(15, 160)">
      <rect x="0" y="0" width="305" height="220" rx="12" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
      <circle cx="20" cy="22" r="7" fill="#3182ce"/>
      <circle cx="20" cy="22" r="3" fill="#ffffff"/>
      <text x="38" y="26" font-size="12" font-weight="bold" fill="#2b6cb0">模式 2：個人專屬 API Key (BYOK 推薦)</text>
      
      <text x="38" y="48" font-size="10.5" fill="#2c5282">• 獨佔 10,000 每日 Quota (約可刪 200 支/天)</text>
      <text x="38" y="66" font-size="10.5" fill="#2c5282">• 填入您申請的 Google YouTube API Key：</text>

      <!-- Input Field -->
      <rect x="20" y="80" width="265" height="38" rx="6" fill="#ffffff" stroke="#3182ce" stroke-width="1.5"/>
      <text x="30" y="104" font-size="11" fill="#1a202c">AIzaSyD-9xK2mP8vL1nQ3rT7uV...</text>

      <!-- OAuth Client ID Input Field -->
      <text x="20" y="138" font-size="10.5" fill="#2c5282">• 選擇性填入個人 OAuth Client ID：</text>
      <rect x="20" y="148" width="265" height="38" rx="6" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
      <text x="30" y="172" font-size="10.5" fill="#a0aec0">xxxx.apps.googleusercontent.com</text>
    </g>

    <!-- Tutorial Link -->
    <text x="167.5" y="412" font-size="11" font-weight="bold" fill="#3182ce" text-anchor="middle">📖 點此查看：30 秒免費申請個人 API Key 教學</text>

    <!-- Save Button -->
    <rect x="15" y="440" width="305" height="50" rx="12" fill="#3182ce"/>
    <text x="167.5" y="471" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">儲存並套用設定</text>
  </g>

  <text x="187.5" y="700" font-size="10" fill="#ffffff" text-anchor="middle">Modal: API Quota &amp; BYOK Settings Wireframe</text>
</svg>
