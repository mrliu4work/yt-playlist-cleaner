<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" width="375" height="750" style="background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Phone Shell -->
  <rect x="5" y="5" width="365" height="740" rx="30" ry="30" fill="#ffffff" stroke="#1a202c" stroke-width="4"/>
  
  <!-- Status Bar -->
  <text x="30" y="32" font-size="12" font-weight="bold" fill="#1a202c">9:41</text>
  <text x="310" y="32" font-size="12" fill="#1a202c">📶 🔋</text>

  <!-- Navigation Header -->
  <rect x="7" y="45" width="361" height="45" fill="#2d3748"/>
  <text x="187.5" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">清理成果結算</text>

  <!-- Dimmed Background Overlay -->
  <rect x="7" y="45" width="361" height="695" fill="#000000" opacity="0.4"/>

  <!-- Modal Container -->
  <g transform="translate(25, 140)">
    <rect x="0" y="0" width="325" height="480" rx="20" fill="#ffffff"/>
    
    <!-- Celebration Icon & Title -->
    <text x="162.5" y="60" font-size="50" text-anchor="middle">🎉</text>
    <text x="162.5" y="105" font-size="20" font-weight="bold" fill="#2d3748" text-anchor="middle">太棒了！本輪清理完成</text>
    <text x="162.5" y="128" font-size="12" fill="#718096" text-anchor="middle">順利釋放你的播放清單空間</text>

    <!-- Stats Table Box -->
    <rect x="20" y="150" width="285" height="150" rx="12" fill="#f7fafc" stroke="#edf2f7" stroke-width="1.5"/>
    
    <g transform="translate(40, 185)">
      <text x="0" y="0" font-size="13" fill="#4a5568">🗑️  已刪除影片：</text>
      <text x="225" y="0" font-size="15" font-weight="bold" fill="#e53e3e" text-anchor="end">14 支</text>

      <text x="0" y="40" font-size="13" fill="#4a5568">⏱️  釋放播放時間：</text>
      <text x="225" y="40" font-size="15" font-weight="bold" fill="#3182ce" text-anchor="end">5 小時 30 分</text>

      <text x="0" y="80" font-size="13" fill="#4a5568">💖  保留精選項目：</text>
      <text x="225" y="80" font-size="15" font-weight="bold" fill="#38a169" text-anchor="end">8 支</text>
    </g>

    <!-- Primary Action Button (Commit) -->
    <rect x="20" y="325" width="285" height="52" rx="12" fill="#3182ce"/>
    <text x="162.5" y="357" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">確定提交並套用刪除 (Commit)</text>

    <!-- Secondary Action Button -->
    <rect x="20" y="390" width="285" height="45" rx="12" fill="#edf2f7"/>
    <text x="162.5" y="417" font-size="13" font-weight="bold" fill="#4a5568" text-anchor="middle">繼續清理其他播放清單</text>
  </g>

  <text x="187.5" y="700" font-size="10" fill="#ffffff" text-anchor="middle">Screen 4: Session Summary Modal Wireframe</text>
</svg>
