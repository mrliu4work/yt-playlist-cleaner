<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 750" width="375" height="750" style="background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Phone Shell -->
  <rect x="5" y="5" width="365" height="740" rx="30" ry="30" fill="#ffffff" stroke="#1a202c" stroke-width="4"/>
  
  <!-- Status Bar -->
  <text x="30" y="32" font-size="12" font-weight="bold" fill="#1a202c">9:41</text>
  <text x="310" y="32" font-size="12" fill="#1a202c">📶 🔋</text>

  <!-- Navigation Header -->
  <rect x="7" y="45" width="361" height="45" fill="#2d3748"/>
  <text x="187.5" y="73" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">選擇播放清單</text>

  <!-- User Profile Header Bar -->
  <rect x="7" y="90" width="361" height="55" fill="#edf2f7"/>
  <circle cx="35" cy="117.5" r="18" fill="#4a5568"/>
  <text x="35" y="122" font-size="12" fill="#ffffff" text-anchor="middle">A</text>
  <text x="62" y="114" font-size="13" font-weight="bold" fill="#2d3748">Alex (alex@gmail.com)</text>
  <text x="62" y="130" font-size="10" fill="#718096">已連線至 YouTube Data API</text>

  <!-- Quota Badge & Settings Button -->
  <rect x="220" y="105" width="100" height="26" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="1"/>
  <text x="270" y="122" font-size="10" font-weight="bold" fill="#2b6cb0" text-anchor="middle">⚡ 可刪: 18 支</text>

  <rect x="328" y="103" width="30" height="30" rx="6" fill="#e2e8f0"/>
  <text x="343" y="123" font-size="15" text-anchor="middle">⚙️</text>

  <!-- Instruction Banner -->
  <rect x="20" y="160" width="335" height="45" rx="10" fill="#fefcbf" stroke="#d69e2e" stroke-width="1"/>
  <text x="187.5" y="187" font-size="12" font-weight="bold" fill="#744210" text-anchor="middle">💡 點擊下方清單即可開始極速刷卡清理</text>

  <!-- Playlist List Section Title -->
  <text x="25" y="230" font-size="14" font-weight="bold" fill="#2d3748">你的自訂播放清單 (3)</text>

  <!-- Playlist Card 1 -->
  <g transform="translate(20, 245)">
    <rect x="0" y="0" width="335" height="95" rx="12" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <rect x="10" y="10" width="110" height="75" rx="8" fill="#cbd5e0"/>
    <text x="65" y="52" font-size="12" fill="#4a5568" text-anchor="middle">📋 封面縮圖</text>
    
    <text x="132" y="32" font-size="14" font-weight="bold" fill="#2d3748">待清理精選 (To Clean)</text>
    <text x="132" y="53" font-size="11" fill="#718096">48 支影片 • 上次更新 2 天前</text>
    
    <rect x="132" y="63" width="95" height="20" rx="4" fill="#e6fffa"/>
    <text x="179.5" y="77" font-size="10" font-weight="bold" fill="#234e52" text-anchor="middle">含 2 支下架影片</text>
  </g>

  <!-- Playlist Card 2 -->
  <g transform="translate(20, 355)">
    <rect x="0" y="0" width="335" height="95" rx="12" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="10" y="10" width="110" height="75" rx="8" fill="#cbd5e0"/>
    <text x="65" y="52" font-size="12" fill="#4a5568" text-anchor="middle">📚 封面縮圖</text>
    
    <text x="132" y="32" font-size="14" font-weight="bold" fill="#2d3748">深度學習與 AI 教學</text>
    <text x="132" y="53" font-size="11" fill="#718096">120 支影片 • 上次更新 1 個月前</text>
    
    <rect x="132" y="63" width="80" height="20" rx="4" fill="#edf2f7"/>
    <text x="172" y="77" font-size="10" fill="#4a5568" text-anchor="middle">已下載備份</text>
  </g>

  <!-- Playlist Card 3 -->
  <g transform="translate(20, 465)">
    <rect x="0" y="0" width="335" height="95" rx="12" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
    <rect x="10" y="10" width="110" height="75" rx="8" fill="#cbd5e0"/>
    <text x="65" y="52" font-size="12" fill="#4a5568" text-anchor="middle">🎵 封面縮圖</text>
    
    <text x="132" y="32" font-size="14" font-weight="bold" fill="#2d3748">工作背景音樂暫存</text>
    <text x="132" y="53" font-size="11" fill="#718096">15 支影片 • 上次更新 3 天前</text>
  </g>

  <!-- Pull to Refresh Hint -->
  <text x="187.5" y="600" font-size="12" fill="#a0aec0" text-anchor="middle">🔄 下滑重新整理播放清單</text>

  <!-- Quick Guide Footer -->
  <rect x="20" y="630" width="335" height="50" rx="10" fill="#edf2f7"/>
  <text x="187.5" y="652" font-size="11.5" font-weight="bold" fill="#3182ce" text-anchor="middle">📖 沒看到想要的清單？[點此查看轉存教學]</text>
  <text x="187.5" y="668" font-size="9.5" fill="#718096" text-anchor="middle">Screen 2: Playlist Selector Wireframe</text>
</svg>
